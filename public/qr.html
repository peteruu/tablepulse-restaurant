<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>U Marienky · QR generátor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar no-print">
    <div>
      <div class="eyebrow">U Marienky</div>
      <h1>QR kódy na stoly</h1>
      <p class="muted">Vygenerujte tlačiteľné QR kartičky pre objednávanie od stola.</p>
    </div>
    <div class="actions">
      <a class="secondary button-link" href="config.php">Config</a>
      <button id="refreshQrBtn" class="secondary">Refresh</button>
      <button id="printQrBtn" class="primary print-button">Print</button>
    </div>
  </header>

  <main class="qr-layout">
    <section class="panel no-print">
      <h2>Nastavenia QR</h2>
      <label>
        Základná URL objednávky
        <input id="baseUrl" placeholder="https://example.com/order.html">
      </label>
      <p class="muted small-print">Číslo stola sa pridá ako <code>?t=7</code>. Pred tlačou použite finálnu URL na restauraciaumarienky.sk.</p>
      <label>
        Text na kartičke
        <input id="qrSubtitle" value="Naskenujte a objednajte si od stola">
      </label>
      <button id="generateQrBtn" class="secondary" type="button">Pregenerovať</button>
      <p id="qrNotice" class="notice" role="status"></p>
    </section>

    <section class="qr-print-sheet" id="qrSheet" aria-live="polite"></section>
  </main>

  <script src="assets/vendor/qrcode-generator.js"></script>
  <script src="qr.js"></script>
  <script>TablePulseQr.init();</script>
</body>
</html>
